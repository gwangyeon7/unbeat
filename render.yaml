# unbeat 백엔드 배포용 Render Blueprint.
#
# 사용법: Render 대시보드 -> New -> Blueprint -> 이 저장소 선택 -> render.yaml 자동 인식.
# `sync: false`로 표시된 값은 여기 안 적혀 있고, Blueprint 최초 생성 시 대시보드에서
# 직접 입력해야 함(API 키를 git에 커밋하지 않기 위함) — LASTFM_API_KEY 등은 backend/.env에
# 있는 실제 값을 그대로 옮겨 입력하면 됨.
#
# 비용: unbeat-backend/unbeat-playlist/unbeat-redis는 plan: free라 0원.
# unbeat-mariadb만 퍼시스턴트 디스크가 필요해서 유료 최소 플랜(0.5c-512mb, 예전 이름
# "starter")을 써야 함 — 대략 월 $7 수준. (Render는 디스크가 무료 플랜에서 아예 지원 안 됨,
# https://render.com/docs/disks 참고)

services:
  # FastAPI 메인 백엔드 (검색/추천/무드탐색/이벤트 로깅) — backend/Dockerfile로 빌드
  - type: web
    name: unbeat-backend
    runtime: docker
    rootDir: backend
    # rootDir을 지정하면 dockerfilePath/dockerContext는 "저장소 루트"가 아니라
    # rootDir 기준 상대경로로 다시 계산된다(실제 배포 시 backend/backend로 겹쳐서 실패하는 걸
    # 확인함 - 예전 주석은 반대로 잘못 가정하고 있었음). 그래서 rootDir 안에서부터의
    # 상대경로만 적어야 한다.
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /
    envVars:
      # fromService(property: host/port)로 가져오는 값이 Blueprint sync 타이밍에 따라
      # 갱신이 안 되는 문제를 겪어서(대시보드에서 확인해보니 실제 주소가
      # unbeat-mariadb:3306으로 고정이라), 아예 고정값으로 직접 박아넣음.
      - key: DB_HOST
        value: unbeat-mariadb
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        fromService:
          name: unbeat-mariadb
          type: pserv
          envVarKey: MARIADB_USER
      - key: DB_PASSWORD
        fromService:
          name: unbeat-mariadb
          type: pserv
          envVarKey: MARIADB_PASSWORD
      - key: DB_NAME
        fromService:
          name: unbeat-mariadb
          type: pserv
          envVarKey: MARIADB_DATABASE
      - key: REDIS_HOST
        fromService:
          name: unbeat-redis
          type: keyvalue
          property: host
      - key: REDIS_PORT
        fromService:
          name: unbeat-redis
          type: keyvalue
          property: port
      - key: LASTFM_API_KEY
        sync: false
      - key: LASTFM_SHARED_SECRET
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_SECRET
        sync: false
      # Vercel 프론트 실제 배포 주소. 대시보드에서 API로 먼저 넣었다가, 이 값이 빈 문자열로
      # 남아있으면 다음 git push 때 Blueprint sync가 다시 ""로 덮어써버리는 걸 확인해서
      # (실제로 CORS가 재발했음) 아예 여기 실제 값을 박아넣음.
      - key: ALLOWED_ORIGINS
        value: "https://unbeat-delta.vercel.app,https://unbeat.org,https://www.unbeat.org"

  # Kotlin/Spring Boot 즐겨찾기·재생목록 서비스 — playlist-service/Dockerfile로 빌드
  - type: web
    name: unbeat-playlist
    runtime: docker
    rootDir: playlist-service
    # backend 서비스와 같은 이유로 rootDir 기준 상대경로로 수정.
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    # /actuator/health는 DB 상태까지 확인하다가 DB 연결이 간헐적으로 불안정할 때 응답 없이
    # 멈춰서(hang) 배포가 "Timed Out"으로 실패하는 문제가 있었음(management.health.db.enabled
    # =false로도 해결 안 됨) — DB랑 전혀 무관한 /healthz(HealthController)로 교체.
    healthCheckPath: /healthz
    envVars:
      # fromService(property: host/port)로 가져오는 값이 Blueprint sync 타이밍에 따라
      # 갱신이 안 되는 문제를 겪어서(대시보드에서 확인해보니 실제 주소가
      # unbeat-mariadb:3306으로 고정이라), 아예 고정값으로 직접 박아넣음.
      - key: DB_HOST
        value: unbeat-mariadb
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        fromService:
          name: unbeat-mariadb
          type: pserv
          envVarKey: MARIADB_USER
      - key: DB_PASSWORD
        fromService:
          name: unbeat-mariadb
          type: pserv
          envVarKey: MARIADB_PASSWORD
      - key: DB_NAME
        fromService:
          name: unbeat-mariadb
          type: pserv
          envVarKey: MARIADB_DATABASE
      - key: LASTFM_API_KEY
        sync: false
      # backend와 동일한 이유 — Vercel 프론트에서 즐겨찾기/재생목록 API를 호출할 수 있게 함.
      - key: ALLOWED_ORIGINS
        value: "https://unbeat-delta.vercel.app,https://unbeat.org,https://www.unbeat.org"

  # MariaDB — db/Dockerfile로 공식 mariadb 이미지에 backend/schema.sql만 얹어서 빌드.
  # 컨테이너 최초 기동 시 자동으로 스키마가 적용됨(공식 이미지의 initdb.d 기능).
  # 데이터는 퍼시스턴트 디스크에 저장 — 이 서비스만 유료 플랜이 필요한 이유가 이 디스크 때문.
  - type: pserv
    name: unbeat-mariadb
    runtime: docker
    dockerfilePath: db/Dockerfile
    plan: 0.5c-512mb
    region: singapore
    disk:
      name: unbeat-mariadb-data
      mountPath: /var/lib/mysql
      sizeGB: 1
    envVars:
      # Render는 pserv의 포트를 명시 안 하면 다른 서비스가 fromService로 가져가는
      # property: port 값이 MariaDB 실제 포트(3306)와 안 맞아 Connection refused가 남.
      - key: PORT
        value: 3306
      - key: MARIADB_DATABASE
        value: unbeat
      - key: MARIADB_USER
        value: unbeat
      - key: MARIADB_PASSWORD
        generateValue: true
      - key: MARIADB_ROOT_PASSWORD
        generateValue: true

  # Redis — 캐시 전용(검색결과/빠른선곡 등)이라 재시작 시 데이터 날아가도 무방.
  # 무료 Key Value는 외부 IP 허용 목록이 필수 필드라 빈 목록(내부 전용)으로 둠.
  - type: keyvalue
    name: unbeat-redis
    plan: free
    region: singapore
    ipAllowList: []
