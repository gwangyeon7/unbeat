<!DOCTYPE html>
<!--
  (§73) 백그라운드 재생 재설계 — 화면에 보이는 액티비티의 웹뷰가 아니라, 포그라운드
  서비스(PlaybackService.java)가 소유한 "안 보이는" 별도 웹뷰가 이 파일을 로드해서
  유튜브 iframe을 재생함. 이 웹뷰는 액티비티 생명주기랑 완전히 분리돼 있어서(서비스가
  살아있는 한 안드로이드가 서피스를 정리하지 않음), 홈 버튼을 눌러도 안 죽는 게 핵심.
  이 파일은 정적 로컬 asset이라 ngrok/개발 서버 상태와 무관하게 항상 로드됨.
-->
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; padding: 0; background: #000; }
    #player { width: 1px; height: 1px; }
  </style>
</head>
<body>
  <div id="player"></div>
  <script>
    var ytPlayer = null;
    var pendingVideoId = null;
    var isApiReady = false;
    // (§73 버그 수정) 리액트 개발 모드(StrictMode)가 컴포넌트를 일부러 두 번 마운트하는
    // 습성 때문에, 이 헤드리스 페이지는 하나의 공유 인스턴스인데 loadAndPlay가 같은
    // 영상에 대해 거의 동시에(수십ms 간격) 두 번씩 불려서 유튜브 플레이어가 로딩
    // 도중에 계속 리셋되는(BUFFERING↔UNSTARTED 무한 반복) 문제를 실기로 확인함(재생이
    // 영원히 시작 안 됨). 웹 경로는 마운트마다 새 iframe을 만들고 destroy()가 확실히
    // 정리해줘서 안 겪는 문제인데, 여기는 웹뷰/플레이어가 서비스 생명주기 동안 딱 하나만
    // 있는 싱글턴이라 다르게 터짐. 짧은 시간 안에 같은 videoId로 또 요청이 오면 무시하는
    // 디바운스로 막음.
    var lastRequestedVideoId = null;
    var lastRequestedAt = 0;

    // (§73 후속 — 화면 꺼짐 상태에서 다음 곡 자동전환 안 되는 버그 수정) 곡 끝(ENDED)을
    // 처리하는 판단 로직이 화면 쪽 액티비티 웹뷰(React)에 있었는데, 안드로이드가 화면이
    // 꺼지면 그 웹뷰의 JS 실행을 강하게 억제해서 "다음 곡으로 넘어갈지" 판단 자체가 멈추는
    // 문제를 실기로 확인함. 이 헤드리스 웹뷰는 화면 상태와 무관하게 계속 잘 도는 게 이미
    // 확인됐으므로, "다음 곡 1곡 미리보기"를 nativeSetQueue로 여기 저장해두고, 곡이 끝나면
    // 액티비티 웹뷰를 거치지 않고 이 페이지 스스로 바로 다음 곡을 틀도록 함.
    var queue = [];

    window.nativeSetQueue = function (jsonArray) {
      try {
        var parsed = JSON.parse(jsonArray);
        queue = Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        queue = [];
      }
    };

    // 큐에 있으면 다음 곡으로 넘어가고 true, 없으면 아무것도 안 하고 false를 반환.
    function advanceQueue() {
      if (!queue || queue.length === 0) return false;
      var next = queue.shift();
      if (!next || !next.videoId) return false;
      lastRequestedVideoId = next.videoId;
      lastRequestedAt = Date.now();
      if (!isApiReady || !ytPlayer || !ytPlayer.loadVideoById) {
        pendingVideoId = next.videoId;
      } else {
        ytPlayer.loadVideoById(next.videoId);
      }
      postEvent("autoAdvance", {
        videoId: next.videoId,
        title: next.title || "",
        artist: next.artist || "",
      });
      return true;
    }

    function postEvent(type, data) {
      try {
        if (window.AndroidBridge && window.AndroidBridge.onEvent) {
          window.AndroidBridge.onEvent(JSON.stringify(Object.assign({ type: type }, data || {})));
        }
      } catch (e) {}
    }

    // (§73 진단용) onPageFinished는 찍히는데 ready/timeUpdate가 전혀 안 찍히는 문제 —
    // 인라인 스크립트 자체는 실행되는지, 유튜브 iframe_api 스크립트는 실제로 로드/에러
    // 나는지를 구분하기 위해 추가. 이 줄이 안 찍히면 인라인 스크립트 자체가 안 도는 거고,
    // 찍히는데 scriptLoaded/scriptError가 안 찍히면 네트워크/외부 스크립트 쪽 문제로 좁혀짐.
    postEvent("scriptParsed", {});

    // YT.PlayerState 숫자 그대로 JS 쪽(MiniPlayer.tsx)의 기존 YT.PlayerState 상수와
    // 맞춰서 넘김 — 어댑터 쪽에서 값 변환 없이 그대로 재사용 가능하게 함.
    function onPlayerStateChange(e) {
      // state 0 = ENDED. 큐에 다음 곡이 있으면 여기서 바로 넘어가고, 그 경우 raw
      // "ended"(state:0) 이벤트는 보내지 않음 — PlaybackService가 그걸 "완전히 끝남"으로
      // 오해해서 알림을 내려버리는 걸 막기 위함(대신 autoAdvance 이벤트로 계속 재생 중임을 알림).
      if (e.data === 0 && advanceQueue()) {
        return;
      }
      postEvent("stateChange", { state: e.data, duration: ytPlayer.getDuration() });
    }

    function onPlayerReady(e) {
      postEvent("ready", { duration: ytPlayer.getDuration() });
      if (pendingVideoId) {
        ytPlayer.loadVideoById(pendingVideoId);
        pendingVideoId = null;
      }
    }

    // (§73 진단용) 재생이 시작 안 될 때 원인을 몰라서 추가 — 유튜브 IFrame API는 임베드
    // 자체가 막힌 영상(저작권/지역 제한 등)이거나 잘못된 videoId일 때 이 콜백으로 에러
    // 코드를 줌(2=잘못된 파라미터, 5=HTML5 플레이어 에러, 100=영상 없음, 101/150=임베드
    // 재생 금지 영상). 이게 한 번도 안 찍히면 API/네트워크 쪽 문제, 찍히면 영상 자체
    // 문제로 원인을 좁힐 수 있음.
    function onPlayerError(e) {
      postEvent("error", { code: e.data });
    }

    window.onYouTubeIframeAPIReady = function () {
      isApiReady = true;
      ytPlayer = new YT.Player("player", {
        height: "1",
        width: "1",
        playerVars: { autoplay: 0, controls: 0, modestbranding: 1, rel: 0 },
        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange,
          onError: onPlayerError,
        },
      });
    };

    // 시간 폴링 — MiniPlayer.tsx가 진행바 갱신하려고 500ms마다 getCurrentTime()을 부르던
    // 것과 같은 역할을 여기서 대신하고, 결과를 이벤트로 안드로이드 쪽에 보내줌.
    setInterval(function () {
      if (ytPlayer && ytPlayer.getCurrentTime) {
        postEvent("timeUpdate", { currentTime: ytPlayer.getCurrentTime() });
      }
    }, 500);

    // 아래 함수들은 PlaybackService.java가 evaluateJavascript(...)로 직접 호출함.
    window.nativeLoadAndPlay = function (videoId) {
      var now = Date.now();
      if (videoId === lastRequestedVideoId && now - lastRequestedAt < 1500) {
        return; // 중복 호출(StrictMode 이중 마운트 등) 무시
      }
      lastRequestedVideoId = videoId;
      lastRequestedAt = now;

      if (!isApiReady || !ytPlayer || !ytPlayer.loadVideoById) {
        pendingVideoId = videoId;
        return;
      }
      ytPlayer.loadVideoById(videoId);
    };
    window.nativePlay = function () {
      ytPlayer && ytPlayer.playVideo && ytPlayer.playVideo();
    };
    window.nativePause = function () {
      ytPlayer && ytPlayer.pauseVideo && ytPlayer.pauseVideo();
    };
    window.nativeSeekTo = function (seconds) {
      ytPlayer && ytPlayer.seekTo && ytPlayer.seekTo(seconds, true);
    };
    window.nativeSetVolume = function (vol) {
      ytPlayer && ytPlayer.setVolume && ytPlayer.setVolume(vol);
    };
    window.nativeMute = function () {
      ytPlayer && ytPlayer.mute && ytPlayer.mute();
    };
    window.nativeUnmute = function () {
      ytPlayer && ytPlayer.unMute && ytPlayer.unMute();
    };

    // (§73 진단용) 정적 <script src="..."> 태그는 로드 성공/실패를 잡을 방법이 없어서,
    // 대신 JS로 동적으로 만들어서 onload/onerror를 붙임 — 유튜브 iframe_api 스크립트
    // 자체가 이 헤드리스 웹뷰에서 다운로드/실행되는지 직접 확인하기 위함.
    (function loadYoutubeApiScript() {
      var s = document.createElement("script");
      s.src = "https://www.youtube.com/iframe_api";
      s.onload = function () { postEvent("scriptLoaded", {}); };
      s.onerror = function (e) { postEvent("scriptError", { message: String(e) }); };
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
