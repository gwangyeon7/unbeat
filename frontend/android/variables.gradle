ext {
    // (§73) 23으로 낮춰서 갤럭시 On7(API 23) 지원을 시도했으나, cordova-android 14.0.1
    // 라이브러리 자체가 "uses-sdk:minSdkVersion 23 cannot be smaller than version 24"로
    // 빌드를 막음(Manifest merger failed) — cordova-plugin-background-mode를 쓰기 위해
    // 들여온 capacitor-cordova-android-plugins 의존성이 강제하는 하한선이라 우회 불가
    // (tools:overrideLibrary로 강제하는 방법이 있지만 "runtime failures 유발 가능"이라고
    // 경고돼 있어서 채택 안 함). 24로 되돌림 — 결론: 이 프로젝트는 API 23 기기(안드로이드
    // 6.0 이하)를 지원할 수 없음, 실기기 테스트는 API 24(안드로이드 7.0) 이상 기기 필요.
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}