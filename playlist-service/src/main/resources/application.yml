server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/unbeat?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:unbeat}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    # MariaDB가 JDBC 메타데이터에 자기 버전을 MySQL 호환 형식(5.5.5-MariaDB-...)으로 보고하는데,
    # 최신 Hibernate의 자동 dialect 감지가 이걸 못 알아채서 방언을 명시적으로 지정해줘야 함.
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      # 개발 단계라 update로 편하게 씀. 운영이었다면 flyway/liquibase로 마이그레이션 관리했을 것.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# 즐겨찾기 트랙의 무드/장르 태그를 가져오기 위해 Last.fm을 직접 호출할 때 씀 (LastFmTagClient)
lastfm:
  api-key: ${LASTFM_API_KEY:}
