server:
  # Render는 컨테이너가 바인딩할 포트를 PORT 환경변수로 내려주므로(고정된 8081을 못 씀),
  # 없으면(로컬 개발) 기존 기본값 8081을 그대로 씀.
  port: ${PORT:8081}

spring:
  datasource:
    # 예전엔 호스트/포트가 127.0.0.1:3306으로 하드코딩돼 있었는데, Render처럼 DB가 다른
    # 컨테이너/호스트에서 도는 배포 환경에서는 그대로 못 씀 — DB_HOST/DB_PORT를 환경변수로
    # 받고 로컬 개발 기본값만 127.0.0.1:3306으로 유지.
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:unbeat}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:unbeat}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Render 배포 초기(컨테이너 막 기동 직후)에 DB가 순간적으로 응답이 늦어서 첫 연결
      # 시도가 실패하면 기본 설정으론 앱 전체가 죽어버림 — initialization-fail-timeout을
      # -1로 주면 첫 연결이 실패해도 앱은 정상적으로 뜨고, 이후 실제 쿼리가 들어올 때
      # 백그라운드에서 계속 재시도함. 일시적인 연결 문제 때문에 컨테이너가 죽는 걸 방지.
      initialization-fail-timeout: -1
      connection-timeout: 30000
  jpa:
    # MariaDB가 JDBC 메타데이터에 자기 버전을 MySQL 호환 형식(5.5.5-MariaDB-...)으로 보고하는데,
    # 최신 Hibernate의 자동 dialect 감지가 이걸 못 알아채서 방언을 명시적으로 지정해줘야 함.
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      # 개발 단계라 update로 편하게 씀. 운영이었다면 flyway/liquibase로 마이그레이션 관리했을 것.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# 즐겨찾기 트랙의 무드/장르 태그를 가져오기 위해 Last.fm을 직접 호출할 때 씀 (LastFmTagClient)
lastfm:
  api-key: ${LASTFM_API_KEY:}

# Render의 healthCheckPath(/actuator/health)가 기본 설정으론 DB 연결까지 확인하는데,
# DB 연결이 간헐적으로 끊기는 상황에서 헬스체크마다 걸려서 배포 자체가 "Timed Out"으로
# 실패하는 문제가 있었음 — 헬스체크에서 DB 체크를 빼서 앱만 떠있으면 배포가 통과되게 함.
# (DB 연결 자체는 hikari.initialization-fail-timeout=-1 덕분에 앱을 안 죽이고 계속 재시도함)
management:
  health:
    db:
      enabled: false
